services:
  - type: web
    name: pulse-bridge
    runtime: docker
    healthCheckPath: /api/v1/health
    envVars:
      - key: BOT_MODE
        value: webhook
      - key: LOG_LEVEL
        value: INFO
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: WEBHOOK_BASE_URL
        value: https://pulse-bridge.onrender.com
      - key: WS_TOKEN_TTL
        value: "60"
      - key: MAX_FILE_BYTES
        value: "20971520"
databases:
  - name: pulse-db
    databaseName: pulse
    user: pulse
